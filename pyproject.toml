[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erpnextvn"
version = "0.1.0"
description = "Vietnamese Localization for ERPNext v16"
authors = [
    {name = "1nguoi.com", email = "hello@1nguoi.com"}
]
license = {text = "GPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    "frappe>=16.0.0,<17.0.0",
    "erpnext>=16.0.0,<17.0.0",
    "hrms",
    "requests",
    "pypika @ git+https://github.com/frappe/pypika@2c50e6142b2d61d2d243e466fdd5dc03b3d918f2",
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/mrhuychien/erpnextvn"
